<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naplet CO.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a1c29, #08090d);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Avatar / Logo z Emoji Kasyna i Krypto */
        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #e74c3c, #9b59b6);
            padding: 3px;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.4);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background-color: #0d0f17;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            user-select: none;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #f39c12, #f1c40f, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 0.95rem;
            color: #a0aec0;
            margin-bottom: 28px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.25s ease;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(243, 156, 18, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(243, 156, 18, 0.2);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            margin-right: 16px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-text {
            text-align: left;
            flex-grow: 1;
        }

        .link-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: block;
            color: #ffffff;
        }

        .link-sub {
            font-size: 0.8rem;
            color: #718096;
            display: block;
            margin-top: 2px;
        }

        .arrow {
            font-size: 1.2rem;
            color: #a0aec0;
            transition: transform 0.2s ease;
        }

        .link-card:hover .arrow {
            transform: translateX(4px);
            color: #f39c12;
        }

        footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo z emoji Kasyna i Krypto -->
        <div class="avatar-container">
            <div class="avatar-inner">
                🎰🪙
            </div>
        </div>

        <h1>Naplet CO.</h1>
        <p class="tagline">Oficjalne linki | Naplet Company 🚀</p>

        <div class="links-container">

            <!-- KAFELEK 1: KASYNO -->
            <a href="https://moje-kasyno.onrender.com" target="_blank" class="link-card">
                <div class="icon-box">🎰</div>
                <div class="link-text">
                    <span class="link-title">Naplet Kasyno</span>
                    <span class="link-sub">Pokręć na treningowym kasynie!</span>
                </div>
                <span class="arrow">➔</span>
            </a>

            <!-- KAFELEK 2: KRYPTO -->
            <a href="" target="_blank" class="link-card">
                <div class="icon-box">🪙</div>
                <div class="link-text">
                    <span class="link-title">Sygnały Krypto & Token</span>
                    <span class="link-sub">JUŻ WKRÓTCE!</span>
                </div>
                <span class="arrow">➔</span>
            </a>

            <!-- KAFELEK 3: DISCORD / TELEGRAM -->
            <a href="" target="_blank" class="link-card">
                <div class="icon-box">🎲</div>
                <div class="link-text">
                    <span class="link-title">Społeczność VIP</span>
                    <span class="link-sub">JUŻ WKRÓTCE!</span>
                </div>
                <span class="arrow">➔</span>
            </a>

            <!-- KAFELEK 4: TWITTER / X -->
            <a href="" target="_blank" class="link-card">
                <div class="icon-box">🚀</div>
                <div class="link-text">
                    <span class="link-title">Obserwuj na X / Twitter</span>
                    <span class="link-sub">JUŻ WKRÓTCE!</span>
                </div>
                <span class="arrow">➔</span>
            </a>

        </div>

        <footer>
            © 2026 Naplet CO. All rights reserved | by = wmaxek & maceke
        </footer>
    </div>

</body>
</html>
